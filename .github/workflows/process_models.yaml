name: Process FCC Models

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'fcc_models/*.yml'

jobs:
  process-models:
    # Only run when the PR was actually merged (not just closed/rejected)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated summary files back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Find changed submission files
        id: changed
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.sha }}

          # yml files added or modified in fcc_models/ that are not summary files
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" -- 'fcc_models/*.yml' \
                  | grep -v 'fcc_models/summary_' || true)

          if [ -z "$FILES" ]; then
            echo "No submission files changed. Nothing to do."
            echo "submission_files=" >> $GITHUB_OUTPUT
          else
            echo "Changed submission files:"
            echo "$FILES"
            FILES_SPACE=$(echo "$FILES" | tr '\n' ' ')
            echo "submission_files=$FILES_SPACE" >> $GITHUB_OUTPUT
          fi

      - name: Collect submission files for artifact
        if: steps.changed.outputs.submission_files != ''
        run: |
          mkdir -p /tmp/model-artifact
          for f in ${{ steps.changed.outputs.submission_files }}; do
            cp "$f" /tmp/model-artifact/
          done

      - name: Print artifact contents
        if: steps.changed.outputs.submission_files != ''
        run: |
          echo "=== Artifact files ==="
          ls /tmp/model-artifact/
          echo ""
          for f in /tmp/model-artifact/*; do
            echo "=== $f ==="
            cat "$f"
            echo ""
          done

      - name: Validate and update summaries
        if: steps.changed.outputs.submission_files != ''
        run: |
          python .github/scripts/process_models.py \
            --models-dir fcc_models \
            ${{ steps.changed.outputs.submission_files }}

      - name: Commit summary updates and remove submission files
        if: steps.changed.outputs.submission_files != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage summary updates and submission file deletions together
          git add -u fcc_models/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: process model submissions from PR #${{ github.event.pull_request.number }}"
            git push
          fi

      - name: Upload model artifact
        if: steps.changed.outputs.submission_files != ''
        uses: actions/upload-artifact@v7
        with:
          name: fcc-models-pr-${{ github.event.pull_request.number }}
          path: /tmp/model-artifact/
          if-no-files-found: error
